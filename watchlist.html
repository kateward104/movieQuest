<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/ijc7sgt.css">
    <title>MovieQuest</title>
    <link rel="stylesheet" href="home/css/styles.css">
    <script type="module" src="home/main.js" defer></script>
</head>

<body>
    <nav>
        <a href="index.html"><img id="logo" src="images/MovieQuestLogo.png" alt="MovieQuest Logo"></a>

        <div id="navLinks">
            <div id="navIcon">
                <a href="index.html"><img src="images/icons/footer/home.png" alt="Home Icon">
                    <p>Home</p>
                </a>
            </div>
            <div id="navIcon">
                <a href="watchlist.html"><img src="images/icons/footer/watchlist.png" alt="Watchlist Icon">
                    <p>Watchlist</p>
                </a>
            </div>
            <div id="navIcon">
                <a href="recommendations.html"><img src="images/icons/footer/recommended.png" alt="Recommended Icon">
                    <p>Recommendations</p>
                </a>
            </div>
            <div id="navIcon">
                <a href=""><img src="images/icons/search.png" alt="searchIcon">
                    <p>Search</p>
                </a>
            </div>
        </div>

        <img id="currentProfile" src="images/currentProfile.png" alt="currentProfile.name">

        <!-- Hamburger (Mobile only) -->
        <div id="navDropdown">
            <button class="nav-toggle" id="navToggle"><img src="images/icons/dropdown.png" alt=Menu></button>
        </div>
        <div id="mobileMenu" class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="recommendations.html">Recommendations</a>
            <a href="#">Search</a>
        </div>
    </nav>

    <section class="content">
        <section class="heroInfo">
            <h1>Continue Your Quest</h1>
            <section class="continueQuest">
                <img src="images/movies and series images/fantasy/harrypotter.jpg" alt="Quest Progress">
                <h4>Name of Quest</h4>
                <p>Description of Quest</p>
            </section>
        </section>
        <section class="myFavorites">
            <h2>My Favorites</h2>
            <section class="list">
                <img src="images/movies and series images/fantasy/thehobbit.jpg" alt="Action">
                <img src="images/movies and series images/comedy/jumanjiwelcometothejungle.jpg"
                    alt="Jumanji: Welcome to the Jungle">
                <img src="images/movies and series images/kids/kungfupanda.jpg" alt="Kung Fu Panda">
                <img src="images/movies and series images/action/topgunmaverick.jpg" alt="Top Gun Maverick">
                <img src="images/movies and series images/sci-fi/jurassicpark.jpg" alt="Jurassic Park">
            </section>
        </section>
        <section class="movies">
            <h2>Movies</h2>
            <section class="list">
                <img src="images/movies and series images/action/fallguy.jpg" alt="Fall Guy">
                <img src="images/movies and series images/comedy/nacholibre.jpg" alt="Natcho Libre">
                <img src="images/movies and series images/mystery/knivesout.jpg" alt="Knivesout">
                <img src="images/movies and series images/sci-fi/jurassicpark.jpg" alt="Jurassicpark">
            </section>
            <img src="images/icons/next.png" alt="arrow pointing right for watch more">
        </section>
        <section class="series">
            <h2>Series</h2>
            <section class="list">
                <img src="images/movies and series images/series/psych.jpg" alt="Psych">
                <img src="#" alt="Movie or Series 2">
                <img src="#" alt="Movie or Series 3">
                <img src="#" alt="Movie or Series 4">
            </section>
            <img src="images/icons/next.png" alt="arrow pointing right for watch more">
        </section>
    </section>
    <footer>
        <a href="index.html"><img src="images/MovieQuestLogo.png" alt="MovieQuest Logo"></a>
        <h2>Cookies</h2>
        <h2>Privacy Policy</h2>
        <a href="contact.html">
            <h2>Contact</h2>
        </a>
        </section>
    </footer>
</body>

</html>
