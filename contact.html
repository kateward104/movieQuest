<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieQuest Contact</title>
    <link rel="stylesheet" href="home/css/styles.css">
    <script type="module" src="home/main.js" defer></script>
</head>

<body>
    <nav>
        <a href="index.html"><img id="logo" src="images/MovieQuestLogo.png" alt="MovieQuest Logo"></a>

        <div id="navLinks">
            <a href="index.html">
                <p>Home</p>
            </a>
            <a href="watchlist.html">
                Watchlist
            </a>
            <a href="recommendations.html">
                Recommendations
            </a>
            <!--<img id="searchIcon" src="images/icons/search.png" alt="searchIcon">-->
        </div>

        <!-- Hamburger (Mobile only) -->
        <div id="navDropdown">
            <button class="nav-toggle" id="navToggle"><img src="images/icons/dropdown.png" alt=Menu></button>
        </div>
        <div id="mobileMenu" class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="recommendations.html">Recommendations</a>
            <!--<a href="#">Search</a>-->
        </div>

        <img id="navProfile" src="images/characters/adventurerProfile.png" alt="navProfile.name">

        <section class="profile">
            <div id="avatarModal" class="modal" aria-hidden="true">
                <div class="modal-overlay"></div>
                <div class="modal-content">
                    <h2>Choose Your Character</h2>

                    <div id="avatar-grid">
                        <img class="avatar-option" data-avatar="images/characters/wizard.png"
                            data-profile="images/characters/wizardProfile.png" src="images/characters/wizard.png"
                            alt="Wizard">
                        <img class="avatar-option" data-avatar="images/characters/knight.png"
                            data-profile="images/characters/knightProfile.png" src="images/characters/knight.png"
                            alt="Knight">
                        <img class="avatar-option" data-avatar="images/characters/rogue.png"
                            data-profile="images/characters/rogueProfile.png" src="images/characters/rogue.png"
                            alt="Rogue">
                        <img class="avatar-option" data-avatar="images/characters/witch.png"
                            data-profile="images/characters/witchProfile.png" src="images/characters/witch.png"
                            alt="Witch">
                        <img class="avatar-option" data-avatar="images/characters/adventurer.png"
                            data-profile="images/characters/adventurerProfile.png"
                            src="images/characters/adventurer.png">
                    </div>

                    <button class="modal-close" id="closeModal">X</button>
                    <button class="modal-submit" id="submitModal">Confirm</button>
                </div>
            </div>
        </section>
    </nav>
    <section class="content">
        <!--Collect their first name, last name, email, phone number, gender, subscribe, updates, dropdown music genre, and submit-->
        <h1 id="contactModalTitle">Contact Us</h1>
        <form id="contactForm">
            <label for="firstName">First Name: </label>
            <input type="text" id="firstName" name="firstName" required>
            <br><br>

            <label for="lastName">Last Name: </label>
            <input type="text" id="lastName" name="lastName" required>
            <br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="subject">What Can We Help You With Today?<br></label>
            <textarea id="subject" name="subject" placeholder="Write something.. ."></textarea>
            <br><br>

            <!-- <label for="country">Rate Your Experience </label> -->

            <button type="submit" style=" cursor: pointer; ">Submit Form</button>
        </form>

    </section>
    <footer>
        <section class="footerLinks">
            <class id="footerIcon">
                <a href="index.html"><img src="images/icons/footer/home.png" alt="Home Icon">
                    <p>Home</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="watchlist.html"><img src="images/icons/footer/watchlist.png" alt="Watchlist Icon">
                    <p>Watchlist</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="recommendations.html"><img src="images/icons/footer/recommended.png" alt="Recommended Icon">
                    <p>Recommendations</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="contact.html" class="open-contact-modal"><img src="images/icons/footer/contact.png"
                        alt="Contact Icon">
                    <p>Contact</p>
                </a>
            </class>
        </section>
    </footer>
</body>

</html>
