<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieQuest Contact</title>
    <link rel="stylesheet" href="home/css/styles.css">
    <script type="module" src="home/main.js" defer></script>
</head>

<body>
    <nav>
        <img src="images/icons/back.png" alt="Back Button">
        <a href="index.html"><img src="images/MovieQuestLogo.png" alt="MovieQuest Logo"></a>
    </nav>
    <section class="content">
        <!--Collect their first name, last name, email, phone number, gender, subscribe, updates, dropdown music genre, and submit-->
        <h1>Contact Us</h1>
        <form onsubmit="handleSubmit(event)">

            <label for="firstName">First Name: </label>
            <input type="text" id="firstName" name="firstName" required>
            <br><br>

            <label for="lastName">Last Name: </label>
            <input type="text" id="lastName" name="lastName" required>
            <br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="subject">What Can We Help You With Today?<br></label>
            <textarea id="subject" name="subject" placeholder="Write something.. ." style="height:200px"></textarea>
            <br><br>

            <label for="country">Rate Your Experience </label>
            <br><br><br>

            <button type="submit">Submit Form</button>
        </form>
    </section>
    <footer>
        <section class="footerLinks">
            <class id="footerIcon">
                <a href="index.html"><img src="images/icons/footer/home.png" alt="Home Icon">
                    <p>Home</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="watchlist.html"><img src="images/icons/footer/watchlist.png" alt="Watchlist Icon">
                    <p>Watchlist</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="recommendations.html"><img src="images/icons/footer/recommended.png" alt="Recommended Icon">
                    <p>Recommendations</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="contact.html"><img src="images/icons/footer/contact.png" alt="Contact Icon">
                    <p>Contact</p>
                </a>
            </class>
        </section>
    </footer>
</body>

</html>
