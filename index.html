<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/ijc7sgt.css">
    <title>Movie Quest</title>
    <script type="module" src="home/main.js" defer></script>
    <link rel="stylesheet" href="home/css/styles.css">
</head>

<body>
    <nav>
        <img id="searchIcon" src="images/icons/search.png" alt="searchIcon">
        <a href="index.html"><img src="images/MovieQuestLogo.png" alt="MovieQuest Logo"></a>
        <img id="currentProfile" src="images/currentProfile.png" alt="currentProfile.name">
    </nav>
    <section class="content">
        <section class="heroInfo">
            <h1>Welcome Back [Profile Name]!</h1>
            <section class="avatarAndQuest">
                <img id="profileView" src="images/characters/maleAdventurer.png" alt="Profile Avatar">
                <img src="#" alt="questProgress">
                <h4>Continue Your Quest</h4>
            </section>
        </section>
        <section class="continueWatching">
            <h2>Continue Watching</h2>
            <section class="list">
                <img src="images/movies and series images/family/nightatthemuseum.jpg" alt="Movie or Series 1">
                <img src="images/movies and series images/mystery/thethursdaymurderclub.jpg" alt="Movie or Series 2">
                <img src="images/movies and series images/action/topgunmaverick.jpg" alt="Movie or Series 3">
                <img src="images/movies and series images/fantasy/harrypotter.jpg" alt="Movie or Series 4">
                <img src="images/movies and series images/series/.jpg" alt="Movie or Series 4">
            </section>
            <img src="images/icons/next.png" alt="arrow pointing right for watch more">
        </section>
        <section class="newAndPremium">
            <h2>Newly Added and Premium Content</h2>
            <section class="list">
                <img src="#" alt="Movie or Series 1">
                <img src="#" alt="Movie or Series 2">
                <img src="#" alt="Movie or Series 3">
                <img src="#" alt="Movie or Series 4">
            </section>
            <img src="images/icons/next.png" alt="arrow pointing right for watch more">
        </section>
        <section class="genres">
            <h2>Genres</h2>
            <section class="genresCircles">
                <img src="images/icons/genres/action.png" alt="Action">
                <img src="images/icons/genres/comedy.png" alt="Comedy">
                <img src="images/icons/genres/fantasy.png" alt="Fantasy">
                <img src="images/icons/genres/sci-fi.png" alt="Sci-Fi">
                <img src="images/icons/genres/romance.png" alt="Romance">
                <img src="images/icons/genres/family.png" alt="Family">
                <img src="images/icons/genres/kids.png" alt="Kids">
                <img src="images/icons/genres/mystery.png" alt="Mystery">
            </section>
        </section>
    </section>
    <footer>
        <section class="footerLinks">
            <class id="footerIcon">
                <a href="index.html"><img src="images/icons/footer/home.png" alt="Home Icon">
                    <p>Home</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="watchlist.html"><img src="images/icons/footer/watchlist.png" alt="Watchlist Icon">
                    <p>Watchlist</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="recommendations.html"><img src="images/icons/footer/recommended.png" alt="Recommended Icon">
                    <p>Recommendations</p>
                </a>
            </class>
            <class id="footerIcon">
                <a href="contact.html"><img src="images/icons/footer/contact.png" alt="Contact Icon">
                    <p>Contact</p>
                </a>
            </class>
        </section>
    </footer>
</body>

</html>
